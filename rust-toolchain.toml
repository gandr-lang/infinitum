#:tombi toml-version = "v1.0.0"
# One nightly serves both ordinary crates and quenchant's external Dylint
# plugin. The plugin driver links rustc internals, so rustc-dev and llvm-tools
# travel with the compiler pin; clippy and rustfmt supply their own gates.
# This channel matches the quenchant revision in Cargo.toml. A compiler bump
# must repin both together and invalidate the built driver and library.

[toolchain]
channel = "nightly-2026-06-25"
components = ["clippy", "rustfmt", "rustc-dev", "llvm-tools"]
profile = "minimal"
