#:tombi toml-version = "v1.1.0"

# git-cliff configuration for infinitum release notes. The package's `v<version>`
# tags delimit releases; one package means one tag namespace and one changelog.
# Release-specific surface prose belongs in the release commit body, which this
# template renders under the version heading; every other commit is grouped by
# its Conventional Commit type.
[changelog]
header = """# Changelog

All notable changes to infinitum are documented here.
"""
body = """{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {% if version %}{{ version | trim_start_matches(pat="v") }} {% else %}Unreleased {% endif %}{{ group | striptags | trim | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}**Breaking:** {% endif %}\
{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}
"""
trim = false
render_always = true
footer = """<!-- Generated by git-cliff; edit release tags and commit messages instead. -->\
"""

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = true
fail_on_unmatched_commit = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(?:-rc\\.[0-9]+)?$"
ignore_tags = ".*-rc\\.[0-9]+$"
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
commit_preprocessors = []
commit_parsers = [
  { message = "^feat", group = "<!-- 00 -->Features" },
  { message = "^fix", group = "<!-- 01 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 02 -->Performance" },
  { message = "^refactor", group = "<!-- 03 -->Refactoring" },
  { message = "^docs", group = "<!-- 04 -->Documentation" },
  { message = "^test", group = "<!-- 05 -->Testing" },
  { message = "^build", group = "<!-- 06 -->Build" },
  { message = "^ci", group = "<!-- 07 -->Continuous Integration" },
  { message = "^config", group = "<!-- 08 -->Configuration" },
  { message = "^style", group = "<!-- 09 -->Style" },
  { message = "^chore", group = "<!-- 10 -->Maintenance" },
  { message = "^revert", group = "<!-- 11 -->Reverts" },
]
link_parsers = []
