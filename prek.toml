#:tombi toml-version = "v1.1.0"
#:schema https://www.schemastore.org/prek.json

fail_fast = false
default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "prek-validate-config"
name = "prek validate-config"
language = "system"
entry = "mise exec -- prek validate-config prek.toml"
files.glob = ["prek.toml", "mise.toml", "mise.lock"]
pass_filenames = false
stages = ["pre-commit"]

# The lockfile's two parts move together or not at all: `mise.lock` records
# each npm sidecar tree by digest, and a commit that carries one without the
# other installs from a warm cache here and fails every cold bootstrap.
[[repos.hooks]]
id = "lockfile"
name = "locked-install check"
language = "system"
entry = "mise run check:lockfile"
files.glob = ["mise.toml", "mise.lock", ".mise/locks/**"]
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "conflict-markers"
name = "conflict-marker check"
language = "system"
entry = "mise run check:conflict-markers"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "baseline-hash"
name = "shared baseline check"
language = "system"
entry = "mise run check:baseline-hash"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "treefmt-check"
name = "treefmt --ci"
language = "system"
entry = "mise run treefmt:check"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "commitlint"
name = "commitlint"
entry = "mise x -- commitlint --edit"
language = "system"
stages = ["commit-msg"]
always_run = true
pass_filenames = true
