#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# The changelog formatter reads commit history, which changes without any
# watched file changing, so both tasks run with treefmt's content cache off:
# `--ci` implies `--no-cache` alongside `--fail-on-change`.
[treefmt]
description = "Run treefmt"
run = "treefmt --no-cache"

["treefmt:check"]
description = "Run treefmt in CI mode"
run = "treefmt --ci"

# The changelog generator: a launch line for the workspace binary that decides
# which history to render. `treefmt` calls this as its changelog formatter and
# appends the exclusion argument; `--quiet` keeps cargo's progress out of the
# generated bytes.
[changelog]
description = "Generate the changelog for the history the default branch will hold"
run = "cargo run --quiet --package infinitum-changelog --"
